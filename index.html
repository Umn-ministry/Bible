    <header class="app-bar">

            <p id="dailyVerseRef" class="verse-reference">-</p>
            <div class="card-actions">
                <button id="shareDailyVerse" class="btn-text">
                    <span class="material-icons-round">share</span> பகிர்
                </button>
                <button id="copyDailyVerse" class="btn-text">
                    <span class="material-icons-round">content_copy</span> நகலெடு
                </button>
            </div>
        </section>

        <div class="quick-status-grid">
            <section class="card status-card" id="continueReadingCard" style="display: none;">
                <h3 class="card-subtitle"><span class="material-icons-round">menu_book</span> தொடர்ந்து வாசிக்க</h3>

            <section class="card status-card">
                <h3 class="card-subtitle"><span class="material-icons-round">history</span> அண்மையில் படித்தவை</h3>

                    <li class="empty-text">வரலாறு இல்லை</li>
                </ul>
            </section>
        </div>

        <div class="inline-search-box" onclick="location.href='search.html'">

        <div class="tabs-container">
            <button id="tabOld" class="tab-btn active" onclick="switchTestament('old')">பழைய ஏற்பாடு</button>
            <button id="tabNew" class="tab-btn" onclick="switchTestament('new')">புதிய ஏற்பாடு</button>
        </div>

        <section class="books-grid-section">
            <div id="booksGrid" class="books-grid">
                </div>
